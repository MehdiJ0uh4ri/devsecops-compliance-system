name: Compliance Evidence Collection

# Generates the audit evidence package on a schedule (and on demand), instead
# of someone assembling screenshots by hand the week before an auditor asks.
# See compliance/evidence-collector/collect_evidence.py and
# compliance/soc2/control-matrix.csv for what each control needs as evidence.

on:
  schedule:
    - cron: "0 6 1 * *" # monthly, 1st @ 06:00 UTC
  workflow_dispatch:
    inputs:
      period_label:
        description: "Evidence period label (e.g. 2026-Q3)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  collect-evidence:
    name: Collect SOC2 evidence package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml requests

      - name: Collect evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python compliance/evidence-collector/collect_evidence.py \
            --control-matrix compliance/soc2/control-matrix.csv \
            --output-dir evidence-package \
            --period "${{ github.event.inputs.period_label || 'auto' }}"

      - name: Upload evidence package
        uses: actions/upload-artifact@v4
        with:
          name: soc2-evidence-package
          path: evidence-package/
          retention-days: 2555 # ~7 years, typical audit/compliance retention window

rules:
  - id: hardcoded-aws-credentials
    languages: [python, javascript, typescript, go, yaml]
    severity: ERROR
    message: >-
      Hardcoded AWS credential literal. Load from environment/instance-role/
      secrets-manager instead - see security/secrets/rotate-key-runbook.md if
      this is a real key that has already been committed.
    patterns:
      - pattern-either:
          - pattern: aws_access_key_id = "..."
          - pattern: aws_secret_access_key = "..."
          - pattern-regex: 'AKIA[0-9A-Z]{16}'
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"

  - id: flask-debug-true-in-source
    languages: [python]
    severity: ERROR
    message: >-
      app.run(debug=True) must never ship in source for a production Flask
      app - the Werkzeug debugger allows remote code execution if reachable.
    patterns:
      - pattern: $APP.run(..., debug=True, ...)
    metadata:
      category: security
      cwe: "CWE-489: Active Debug Code"

  - id: subprocess-shell-true
    languages: [python]
    severity: WARNING
    message: >-
      subprocess call with shell=True and a non-literal command risks command
      injection if any part of the command is derived from user input.
    patterns:
      - pattern: subprocess.$FUNC(..., shell=True, ...)
    metadata:
      category: security
      cwe: "CWE-78: OS Command Injection"
      owasp: "A03:2021 - Injection"

  - id: dockerfile-explicit-root-user
    languages: [dockerfile]
    severity: ERROR
    message: >-
      Dockerfile explicitly sets USER root (or uid 0). Mirrors
      policy/opa/containers/no_root.rego enforced at the Kubernetes layer -
      catch it here too, before the image is even built.
    patterns:
      - pattern-either:
          - pattern: USER root
          - pattern: USER 0
    paths:
      include:
        - "**/Dockerfile*"
    metadata:
      category: security
      cwe: "CWE-250: Execution with Unnecessary Privileges"

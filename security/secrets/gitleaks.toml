title = "gitleaks config - devsecops-compliance-pipeline"

# Extend the maintained default ruleset (AWS keys, GCP keys, Slack tokens,
# private keys, generic high-entropy secrets, etc.) rather than reinventing it.
[extend]
useDefault = true

# --- Project-specific additions ---

[[rules]]
id = "internal-api-key"
description = "Internal service API key format (svc_<32 hex>)"
regex = '''svc_[a-f0-9]{32}'''
tags = ["key", "internal"]

[[rules]]
id = "jwt-hardcoded"
description = "Hardcoded JWT (should come from a secret store at runtime, not source)"
regex = '''eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'''
tags = ["jwt"]

# --- Allowlist: known-safe test fixtures / docs ---
# Keep this in sync with security/triage/cve-allowlist.yml's semgrep fixture
# entry - both exist so example/test secrets don't get flagged as real leaks.
[allowlist]
description = "Fixtures, docs, and example credentials that are not live secrets"
paths = [
  '''(?i)tests/fixtures/.*''',
  '''(?i)\.git/.*''',
  '''(?i)docs/.*\.md''',
]
regexes = [
  '''EXAMPLE_KEY_DO_NOT_USE''',
  '''AKIAIOSFODNN7EXAMPLE''', # canonical AWS docs example key
]
